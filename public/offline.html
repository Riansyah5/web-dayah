<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus - Dayah Mataqu</title>
    <link rel="icon" href="/icons/icon-192x192.png" type="image/png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .offline-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 420px;
            width: 100%;
        }
        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: #fee2e2;
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .icon-wrapper svg {
            width: 40px;
            height: 40px;
        }
        h2 {
            font-size: 1.4rem;
            color: #0f172a;
            margin-bottom: 10px;
            font-weight: 700;
        }
        p {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-retry {
            display: inline-block;
            background-color: #4f46e5;
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }
        .btn-retry:hover {
            background-color: #4338ca;
        }
        .btn-retry:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrapper">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364m0 0a9 9 0 012.828-6.364m0 0L3 3m5.464 5.464a5 5 0 017.072 0"></path>
            </svg>
        </div>
        <h2>Koneksi Terputus</h2>
        <p>Anda sedang tidak terhubung ke internet. Silakan periksa jaringan Wi-Fi atau paket data seluler Anda.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            Coba Muat Ulang
        </button>
    </div>
</body>
</html>
